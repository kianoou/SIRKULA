function daysAgo(n){let d=new Date();d.setDate(d.getDate()-n);return d.toISOString().slice(0,10)}
let db=load();
function load(){
 try{
  let x=JSON.parse(localStorage.getItem(KEY));
  if(x&&x.types&&x.customers&&x.deposits){
   x.whatsappPengelola=x.whatsappPengelola||'';
   x.customers.forEach(c=>{if(c.whatsapp===undefined)c.whatsapp=''});
   x.deposits.forEach(d=>{if(d.attachment===undefined)d.attachment=null});
   return x;
  }
 }catch(e){}
 return structuredClone(seed);
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(db));return true}catch(e){console.error(e);toast('Penyimpanan browser penuh atau tidak tersedia. Kurangi lampiran atau kosongkan data browser.');return false}}
function persistMutation(snapshot){if(save())return true;db=snapshot;return false}
const money=n=>new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(Number(n)||0);
const kg=n=>new Intl.NumberFormat('id-ID',{maximumFractionDigits:2}).format(Number(n)||0)+' kg';
const date=s=>s?new Date(s+'T00:00:00').toLocaleDateString('id-ID',{day:'2-digit',month:'short',year:'numeric'}):'-';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const customer=id=>db.customers.find(x=>x.id===id);
const type=id=>db.types.find(x=>x.id===id);
function normalizeWhatsApp(raw){let n=String(raw||'').replace(/\D/g,'');if(n.startsWith('00'))n=n.slice(2);if(n.startsWith('0'))n='62'+n.slice(1);else if(n.startsWith('8'))n='62'+n;return n}
function validWhatsApp(raw){let rawText=String(raw||'').trim();if(!rawText)return true;let n=normalizeWhatsApp(rawText);return n.length>=9&&n.length<=15}
function formatWhatsApp(raw){let n=normalizeWhatsApp(raw);return n?'+'+n:'Belum diisi'}
function whatsAppLink(raw){let n=normalizeWhatsApp(raw);return n?'https://wa.me/'+n:''}
function refreshAdminWhatsApp(){let el=document.getElementById('adminWaLabel'),chat=document.getElementById('adminWaChat');if(el)el.textContent=db.whatsappPengelola?formatWhatsApp(db.whatsappPengelola)+' · Ganti':'Atur WhatsApp';if(chat){chat.href=whatsAppLink(db.whatsappPengelola)||'#';chat.style.display=db.whatsappPengelola?'inline-flex':'none'}}
function editAdminWhatsApp(){openModal('Nomor WhatsApp Pengelola',`<form onsubmit="saveAdminWhatsApp(event)"><div class="notice">Nomor ini akan tampil sebagai kontak resmi pengelola dan digunakan untuk membuka chat WhatsApp. Anda dapat menggantinya kapan saja, misalnya 081234567890 atau 6281234567890.</div><div class="form-group"><label>Nomor WhatsApp *</label><input name="whatsapp" inputmode="tel" autocomplete="tel" required placeholder="08xxxxxxxxxx" value="${esc(db.whatsappPengelola||'')}"></div><div class="modal-actions"><button type="button" class="btn" onclick="closeModal()">Batal</button><button class="btn primary">Simpan Nomor</button></div></form>`)}
function saveAdminWhatsApp(e){e.preventDefault();let raw=new FormData(e.target).get('whatsapp');if(!validWhatsApp(raw)||!normalizeWhatsApp(raw))return toast('Masukkan nomor WhatsApp yang valid.');let previous=db.whatsappPengelola;db.whatsappPengelola=normalizeWhatsApp(raw);if(!save()){db.whatsappPengelola=previous;return}closeModal();refreshAdminWhatsApp();toast('Nomor WhatsApp pengelola diperbarui.')}

const statusLabel=s=>({menunggu:'Menunggu',diverifikasi:'Diverifikasi',selesai:'Selesai',dibatalkan:'Dibatalkan'}[s]||s);
const statusTag=s=>`<span class="status ${s}">${statusLabel(s)}</span>`;
function categoryTag(name){let found=db.types.find(t=>t.nama===name);let icons={'Plastik':'♳','Kardus':'▤','Kertas':'▧','Kaleng':'▣'};return `<span class="category-chip">${esc(found?.icon||icons[name]||'♻')} ${esc(name||'Kategori')}</span>`}
function attachmentMarkup(d){let files=Array.isArray(d.attachments)?d.attachments:(d.attachment?[d.attachment]:[]);if(!files.length)return '<span class="muted" style="font-size:11px">Tidak ada lampiran.</span>';return files.map(a=>{if(!a||!a.dataUrl)return '';let name=esc(a.name||'Lampiran'),url=esc(a.dataUrl),size=((Number(a.size)||0)/1024).toFixed(0);if((a.type||'').startsWith('image/'))return `<div class="attachment-view"><img src="${url}" alt="Lampiran ${name}"><div><a href="${url}" download="${name}">${name}</a><small style="display:block;color:#809087">Gambar · ${size} KB</small></div></div>`;return `<div class="attachment-view"><div class="attachment-icon">▤</div><div><a href="${url}" download="${name}">${name}</a><small style="display:block;color:#809087">Dokumen · ${size} KB</small></div></div>`}).join('')}


function categoryPickerMarkup(selectedId){let available=db.types.filter(t=>t.aktif);return `<input type="hidden" name="type" id="selectedWasteType" value="${esc(selectedId||available[0]?.id||'')}" required><div class="category-choice-grid" id="categoryChoices">${available.map(t=>`<button type="button" class="category-choice ${t.id===(selectedId||available[0]?.id)?'selected':''}" onclick="chooseDepositType('${t.id}')" data-type-choice="${esc(t.id)}"><span class="choice-icon">${esc(t.icon||'♻')}</span><span><b>${esc(t.nama)}</b><small>${money(t.hargaPerKg)} / kg</small></span><span class="choice-check">${t.id===(selectedId||available[0]?.id)?'✓':''}</span></button>`).join('')}</div>`}
function chooseDepositType(id){let t=type(id);if(!t||!t.aktif)return;let input=document.getElementById('selectedWasteType');if(input)input.value=id;document.querySelectorAll('[data-type-choice]').forEach(b=>{let active=b.dataset.typeChoice===id;b.classList.toggle('selected',active);let check=b.querySelector('.choice-check');if(check)check.textContent=active?'✓':''})}
function previewDepositFiles(input){let box=document.getElementById('attachmentPreview');if(!box)return;let files=Array.from(input.files||[]);if(files.length>3){input.value='';box.innerHTML='<div class="file-preview-item">Maksimal 3 lampiran dalam satu pengajuan.</div>';return}let total=files.reduce((n,f)=>n+f.size,0);if(total>1.25*1024*1024){input.value='';box.innerHTML='<div class="file-preview-item">Total ukuran lampiran maksimal 1,25 MB.</div>';return}box.innerHTML=files.map(f=>`<div class="file-preview-item"><b>${f.type.startsWith('image/')?'▧':'▤'}</b> ${esc(f.name)} <span>${(f.size/1024).toFixed(0)} KB</span></div>`).join('')+(files.length?'<button type="button" class="btn small danger" onclick="clearSelectedFiles()">Hapus semua lampiran</button>':'')}
function clearSelectedFiles(){let input=document.getElementById('depositAttachment'),box=document.getElementById('attachmentPreview');if(input)input.value='';if(box)box.innerHTML='';toast('Lampiran pilihan dihapus.')}

 let counts=db.types.map(t=>({name:t.nama,weight:completed.filter(d=>d.jenisSampahId===t.id).reduce((a,d)=>a+(+d.beratAktual||0),0)})),max=Math.max(1,...counts.map(x=>x.weight));
 let recent=[...db.deposits].sort((a,b)=>b.tanggal.localeCompare(a.tanggal)).slice(0,5);
 document.getElementById('view').innerHTML=pageHead('Ringkasan Bank Sampah','Pantau aktivitas dan nilai ekonomi sampah yang terkumpul.')+
 `<section class="welcome-banner"><div class="welcome-copy"><span class="welcome-eyebrow">✦ Gerakan ekonomi sirkular</span><h2>Ubah sampah menjadi nilai.<br>Mulai dari langkah kecil.</h2><p>Kelola setoran, pantau harga, dan bangun kebiasaan daur ulang bersama komunitas SIRKULA.</p></div><div class="welcome-actions"><button class="btn primary" onclick="openDeposit()">＋ Ajukan Setoran</button><button class="btn ghost" onclick="go('kategori')">Jelajahi Kategori</button></div></section><div class="stats">

 <div class="grid-two"><div class="panel"><div class="panel-head"><h3>Komposisi Sampah</h3><span>Berdasarkan berat selesai</span></div>${counts.map(x=>`<div class="bar-row"><span>${esc(x.name)}</span><div class="bar-track"><div class="bar-fill" style="width:${x.weight/max*100}%"></div></div><b>${kg(x.weight)}</b></div>`).join('')||'<div class="empty">Belum ada data kategori.</div>'}<div class="legend"><span><i class="dot" style="background:#3c9a70"></i>Berat aktual</span></div></div>
 <div class="panel"><div class="panel-head"><h3>Perlu Tindakan</h3><span>Ringkasan antrean</span></div><div class="summary-line"><span>Setoran menunggu verifikasi</span><b>${pending}</b></div><div class="summary-line"><span>Setoran diverifikasi</span><b>${db.deposits.filter(d=>d.status==='diverifikasi').length}</b></div><div class="summary-line"><span>Setoran selesai</span><b>${completed.length}</b></div><div style="margin-top:17px"><button class="btn primary" style="width:100%;justify-content:center" onclick="go('setoran')">Kelola Setoran →</button></div></div></div>
 <div class="panel"><div class="panel-head"><h3>Transaksi Terbaru</h3><button class="btn small" onclick="go('riwayat')">Lihat semua →</button></div>${recent.length?`<div class="table-wrap"><table><thead><tr><th>ID Setoran</th><th>Nasabah</th><th>Kategori</th><th>Tanggal</th><th>Nilai</th><th>Status</th></tr></thead><tbody>${recent.map(d=>`<tr><td><b>${esc(d.id)}</b></td><td>${esc(customer(d.customerId)?.nama||'Nasabah dihapus')}</td><td>${categoryTag(d.jenisSampahNama||type(d.jenisSampahId)?.nama||'-')}</td><td>${date(d.tanggal)}</td><td>${money(d.totalNilai)}</td><td>${statusTag(d.status)}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Belum ada transaksi.</div>'}</div><div class="footer-note">SIRKULA · Prototipe demonstrasi · Data disimpan pada browser ini · ${db.whatsappPengelola?'Kontak pengelola: '+esc(formatWhatsApp(db.whatsappPengelola)):'Nomor WhatsApp pengelola belum diatur'}</div>`;
}

function updateSearch(input){let value=input.value,position=input.selectionStart;query=value;render();let next=document.getElementById('searchInput');if(next){next.focus();try{next.setSelectionRange(position,position)}catch(e){}}}
function toolbar(placeholder,filter=''){return `<div class="toolbar"><div class="search"><input id="searchInput" placeholder="${placeholder}" value="${esc(query)}" oninput="updateSearch(this)"></div>${filter}</div>`}

 let list=db.types.filter(t=>`${t.nama} ${t.deskripsi}`.toLowerCase().includes(query.toLowerCase()));

 `<div class="cards">${list.map(t=>`<div class="waste-card"><div class="waste-symbol">${t.icon||'♻'}</div><div style="margin-bottom:7px"><span class="category-chip">♻ Pilihan kategori</span></div><h3>${esc(t.nama)} ${t.aktif?'':'<span class="muted">(Nonaktif)</span>'}</h3><p>${esc(t.deskripsi||'Tidak ada deskripsi.')}</p><div class="price">${money(t.hargaPerKg)} <small>/ kg</small></div><div class="card-actions"><button class="btn small" onclick="openType('${t.id}')">Edit</button><button class="btn small danger" onclick="deleteType('${t.id}')">Hapus</button></div></div>`).join('')||'<div class="empty">Kategori tidak ditemukan.</div>'}</div>`;

 `<div class="panel"><div class="table-wrap"><table><thead><tr><th>Nasabah</th><th>Jenis Pengguna</th><th>WhatsApp</th><th>Total Setoran</th><th>Saldo</th><th>Aksi</th></tr></thead><tbody>${list.map(c=>{let n=db.deposits.filter(d=>d.customerId===c.id).length;return `<tr><td><div class="person"><div class="mini-avatar">${esc(c.nama[0]||'N')}</div><div><b>${esc(c.nama)}</b><small>ID ${esc(c.id)}</small></div></div></td><td>${c.jenisPengguna==='UMKM'?'UMKM':'Masyarakat'}</td><td>${c.whatsapp?`<a class="wa-link" href="${whatsAppLink(c.whatsapp)}" target="_blank" rel="noopener">◉ ${esc(formatWhatsApp(c.whatsapp))}</a>`:'<span class="wa-empty">Belum diisi</span>'}</td><td>${n} transaksi</td><td><b>${money(c.saldo)}</b></td><td><button class="btn small" onclick="openCustomer('${c.id}')">Edit</button> <button class="btn small danger" onclick="deleteCustomer('${c.id}')">Hapus</button></td></tr>`}).join('')||'<tr><td colspan="6"><div class="empty">Nasabah tidak ditemukan.</div></td></tr>'}</tbody></table></div></div>`;

function openType(id=''){
 let t=id?type(id):null;
 openModal(t?'Edit Kategori':'Tambah Kategori',`<form id="typeForm" onsubmit="saveType(event,'${id}')"><div class="form-group"><label>Nama kategori *</label><input name="nama" required maxlength="40" value="${esc(t?.nama||'')}"></div><div class="form-grid"><div class="form-group"><label>Harga per kilogram (Rp) *</label><input name="harga" type="number" min="0" step="1" required value="${t?.hargaPerKg??''}"></div><div class="form-group"><label>Satuan</label><input name="satuan" value="${esc(t?.satuan||'kg')}" required></div></div><div class="form-group"><label>Deskripsi</label><textarea name="deskripsi">${esc(t?.deskripsi||'')}</textarea></div><div class="form-grid"><div class="form-group"><label>Ikon sederhana</label><input name="icon" maxlength="4" value="${esc(t?.icon||'♻')}"></div><div class="form-group"><label>Status</label><select name="aktif"><option value="true" ${t?.aktif!==false?'selected':''}>Aktif</option><option value="false" ${t?.aktif===false?'selected':''}>Nonaktif</option></select></div></div><div class="modal-actions"><button type="button" class="btn" onclick="closeModal()">Batal</button><button class="btn primary">Simpan</button></div></form>`);
}
function saveType(e,id){e.preventDefault();let f=new FormData(e.target),price=Number(f.get('harga')),name=f.get('nama').trim();if(!name)return toast('Nama kategori wajib diisi.');if(!Number.isFinite(price)||price<0)return toast('Harga tidak boleh negatif.');if(db.types.some(t=>t.nama.toLowerCase()===name.toLowerCase()&&t.id!==id))return toast('Nama kategori sudah digunakan.');let snapshot=structuredClone(db),obj={id:id||'w'+Date.now(),nama:name,hargaPerKg:price,satuan:f.get('satuan').trim(),deskripsi:f.get('deskripsi').trim(),icon:f.get('icon')||'♻',aktif:f.get('aktif')==='true'};if(id)Object.assign(type(id),obj);else db.types.push(obj);if(!persistMutation(snapshot))return;closeModal();render();toast('Kategori berhasil disimpan.')}
function deleteType(id){if(db.deposits.some(d=>d.jenisSampahId===id))return toast('Kategori sudah digunakan transaksi, ubah menjadi nonaktif.');if(confirm('Hapus kategori ini?')){let snapshot=structuredClone(db);db.types=db.types.filter(t=>t.id!==id);if(!persistMutation(snapshot))return;render();toast('Kategori dihapus.')}}
function openCustomer(id=''){let c=id?customer(id):null;openModal(c?'Edit Nasabah':'Tambah Nasabah',`<form onsubmit="saveCustomer(event,'${id}')"><div class="form-group"><label>Nama nasabah *</label><input name="nama" required maxlength="70" value="${esc(c?.nama||'')}"></div><div class="form-group"><label>Jenis pengguna *</label><select name="jenis"><option value="masyarakat" ${c?.jenisPengguna!=='UMKM'?'selected':''}>Masyarakat</option><option value="UMKM" ${c?.jenisPengguna==='UMKM'?'selected':''}>UMKM</option></select></div><div class="form-group"><label>Nomor WhatsApp</label><input name="whatsapp" inputmode="tel" autocomplete="tel" placeholder="Contoh: 081234567890" value="${esc(c?.whatsapp||'')}"><small class="muted">Nomor dapat diubah kapan saja melalui tombol Edit.</small></div><div class="notice">Saldo dikelola otomatis dari setoran yang berstatus selesai.</div><div class="modal-actions"><button type="button" class="btn" onclick="closeModal()">Batal</button><button class="btn primary">Simpan</button></div></form>`)}
function saveCustomer(e,id){e.preventDefault();let f=new FormData(e.target),name=f.get('nama').trim(),wa=f.get('whatsapp').trim();if(!name)return toast('Nama wajib diisi.');if(!validWhatsApp(wa))return toast('Nomor WhatsApp harus terdiri dari 9–15 digit.');let snapshot=structuredClone(db);if(id){let c=customer(id);c.nama=name;c.jenisPengguna=f.get('jenis');c.whatsapp=normalizeWhatsApp(wa)}else db.customers.push({id:'c'+Date.now(),nama:name,jenisPengguna:f.get('jenis'),whatsapp:normalizeWhatsApp(wa),saldo:0});if(!persistMutation(snapshot))return;closeModal();render();toast('Data nasabah dan nomor WhatsApp disimpan.')}
function deleteCustomer(id){if(db.deposits.some(d=>d.customerId===id))return toast('Nasabah memiliki riwayat transaksi dan tidak dapat dihapus.');if(confirm('Hapus nasabah ini?')){let snapshot=structuredClone(db);db.customers=db.customers.filter(c=>c.id!==id);if(!persistMutation(snapshot))return;render();toast('Nasabah dihapus.')}}
function openDeposit(){if(!db.customers.length||!db.types.some(t=>t.aktif))return toast('Tambahkan nasabah dan kategori aktif terlebih dahulu.');let first=db.types.find(t=>t.aktif)?.id;openModal('Ajukan Setoran Sampah',`<form id="depositForm" onsubmit="saveDeposit(event)"><div class="notice">Pilih kategori sampah di bawah. Berat yang diisi adalah perkiraan; pengelola akan mencatat berat aktual saat penimbangan.</div><div class="form-group"><label>Nasabah *</label><select name="customer" required>${db.customers.map(c=>`<option value="${c.id}">${esc(c.nama)} · ${c.jenisPengguna}</option>`).join('')}</select></div><div class="form-group"><label>Pilih kategori sampah *</label>${categoryPickerMarkup(first)}</div><div class="form-grid"><div class="form-group"><label>Estimasi berat (kg) *</label><input name="weight" type="number" min="0.01" step="0.01" required placeholder="Contoh: 3.5"></div><div class="form-group"><label>Tanggal setoran *</label><input name="date" type="date" value="${daysAgo(0)}" required></div></div><div class="form-group"><label>Catatan</label><textarea name="note" maxlength="250" placeholder="Catatan tambahan (opsional)"></textarea></div><div class="form-group"><label>Foto atau dokumen pendukung</label><label class="upload-zone" for="depositAttachment"><span class="upload-icon">⇧</span><b>Unggah gambar atau file</b><small>Klik untuk memilih · Maksimal 3 file · Total 1,25 MB</small><input id="depositAttachment" name="attachment" type="file" multiple accept="image/jpeg,image/png,image/webp,image/gif,.pdf,.doc,.docx,.xls,.xlsx,.txt" onchange="previewDepositFiles(this)"></label><div id="attachmentPreview" class="upload-preview"></div></div><div class="modal-actions"><button type="button" class="btn" onclick="closeModal()">Batal</button><button class="btn primary">Kirim Pengajuan</button></div></form>`)}
function readFileAsDataURL(file){return new Promise((resolve,reject)=>{let reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=()=>reject(new Error('Gagal membaca file.'));reader.readAsDataURL(file)})}
let depositSaving=false;
async function saveDeposit(e){
 e.preventDefault();if(depositSaving)return;depositSaving=true;
 let submit=e.submitter||e.target.querySelector('.modal-actions .btn.primary');if(submit)submit.disabled=true;
 try{
  let f=new FormData(e.target),w=Number(f.get('weight')),t=type(f.get('type')),input=e.target.elements.attachment,files=Array.from(input?.files||[]);
  if(!Number.isFinite(w)||w<=0)return toast('Estimasi berat harus lebih dari 0 kg.');
  if(!t||!t.aktif)return toast('Pilih kategori sampah yang masih aktif.');
  if(files.length>3)return toast('Maksimal 3 lampiran per pengajuan.');
  let totalSize=files.reduce((n,file)=>n+file.size,0);if(totalSize>1.25*1024*1024)return toast('Total ukuran lampiran maksimal 1,25 MB.');
  let attachments=[];
  for(let file of files){
   let ext=(file.name.split('.').pop()||'').toLowerCase(),allowed=['pdf','doc','docx','xls','xlsx','txt'],isImage=['image/jpeg','image/png','image/webp','image/gif'].includes(file.type);
   if(!(isImage||allowed.includes(ext)))return toast('Format file belum didukung. Gunakan JPG, PNG, WEBP, GIF, PDF, DOC, XLS, atau TXT.');
   try{attachments.push({name:file.name,type:file.type||'application/octet-stream',size:file.size,dataUrl:await readFileAsDataURL(file)})}catch(err){console.error(err);return toast('File tidak dapat dibaca.');}
  }
  let snapshot=structuredClone(db),item={id:'S-'+db.nextId,customerId:f.get('customer'),jenisSampahId:t.id,jenisSampahNama:t.nama,beratEstimasi:w,beratAktual:null,hargaPerKg:t.hargaPerKg,totalNilai:0,tanggal:f.get('date'),status:'menunggu',catatan:f.get('note').trim(),saldoCredited:false,attachments,attachment:attachments[0]||null};
  db.deposits.push(item);db.nextId++;
  if(!persistMutation(snapshot))return;
  closeModal();render();toast('Pengajuan setoran dan lampiran berhasil disimpan.');
 }catch(err){console.error(err);toast('Pengajuan belum tersimpan. Periksa data dan lampiran, lalu coba lagi.');}
 finally{depositSaving=false;if(submit&&submit.isConnected)submit.disabled=false;}
}
function verifyDeposit(id){let d=db.deposits.find(x=>x.id===id);if(!d)return;let t=type(d.jenisSampahId);openModal('Verifikasi & Penimbangan',`<div class="notice">Harga yang berlaku saat verifikasi akan disimpan sebagai snapshot transaksi.</div><div class="summary-line"><span>Nasabah</span><b>${esc(customer(d.customerId)?.nama||'-')}</b></div><div class="summary-line"><span>Jenis sampah</span><b>${esc(d.jenisSampahNama||t?.nama||'-')}</b></div><div class="summary-line"><span>Estimasi berat</span><b>${kg(d.beratEstimasi)}</b></div><h4 style="font-size:12px;margin:15px 0 5px">Lampiran dari Nasabah</h4>${attachmentMarkup(d)}<form onsubmit="saveVerification(event,'${id}')"><div class="form-grid" style="margin-top:14px"><div class="form-group"><label>Berat aktual (kg) *</label><input name="actual" type="number" min="0" step="0.01" required value="${d.beratAktual??d.beratEstimasi}"></div><div class="form-group"><label>Harga per kg (Rp) *</label><input name="price" type="number" min="0" step="1" required value="${t?.hargaPerKg??d.hargaPerKg}"></div></div><div class="form-group"><label>Catatan pengelola</label><textarea name="note">${esc(d.catatan||'')}</textarea></div><div class="modal-actions"><button type="button" class="btn" onclick="closeModal()">Batal</button><button class="btn primary">Simpan Verifikasi</button></div></form>`)}
function saveVerification(e,id){e.preventDefault();let f=new FormData(e.target),actual=Number(f.get('actual')),price=Number(f.get('price'));if(!Number.isFinite(actual)||actual<0||!Number.isFinite(price)||price<0)return toast('Berat dan harga tidak boleh negatif.');let d=db.deposits.find(x=>x.id===id);if(!d||d.status!=='menunggu')return toast('Status transaksi sudah berubah.');let snapshot=structuredClone(db);d.beratAktual=actual;d.hargaPerKg=price;d.totalNilai=Math.round(actual*price);d.catatan=f.get('note').trim();d.status='diverifikasi';if(!persistMutation(snapshot))return;closeModal();render();toast('Setoran berhasil diverifikasi.')}
function completeDeposit(id){let d=db.deposits.find(x=>x.id===id);if(!d||d.status!=='diverifikasi')return;if(!confirm(`Selesaikan ${id} senilai ${money(d.totalNilai)}? Saldo nasabah akan bertambah satu kali.`))return;let snapshot=structuredClone(db);if(!d.saldoCredited){let c=customer(d.customerId);if(c)c.saldo=Math.max(0,Number(c.saldo)||0)+d.totalNilai;d.saldoCredited=true}d.status='selesai';if(!persistMutation(snapshot)){render();return}render();toast('Setoran selesai dan saldo diperbarui.')}
function cancelDeposit(id){let d=db.deposits.find(x=>x.id===id);if(!d||!['menunggu','diverifikasi'].includes(d.status))return;if(confirm('Batalkan pengajuan setoran ini?')){let snapshot=structuredClone(db);d.status='dibatalkan';if(!persistMutation(snapshot)){render();return}render();toast('Setoran dibatalkan.')}}
function detailDeposit(id){let d=db.deposits.find(x=>x.id===id);if(!d)return;openModal('Detail Transaksi',`<div class="summary-line"><span>ID transaksi</span><b>${esc(d.id)}</b></div><div class="summary-line"><span>Nasabah</span><b>${esc(customer(d.customerId)?.nama||'-')}</b></div><div class="summary-line"><span>WhatsApp nasabah</span><b>${customer(d.customerId)?.whatsapp?`<a class="wa-link" href="${whatsAppLink(customer(d.customerId).whatsapp)}" target="_blank" rel="noopener">Chat ${esc(formatWhatsApp(customer(d.customerId).whatsapp))}</a>`:'Belum diisi'}</b></div><div class="summary-line"><span>Kategori</span><b>${esc(d.jenisSampahNama||'-')}</b></div><div class="summary-line"><span>Tanggal</span><b>${date(d.tanggal)}</b></div><div class="summary-line"><span>Berat estimasi</span><b>${kg(d.beratEstimasi)}</b></div><div class="summary-line"><span>Berat aktual</span><b>${d.beratAktual==null?'-':kg(d.beratAktual)}</b></div><div class="summary-line"><span>Harga snapshot</span><b>${money(d.hargaPerKg)}/kg</b></div><div class="summary-line total"><span>Total nilai</span><b>${money(d.totalNilai)}</b></div><div class="summary-line"><span>Status</span>${statusTag(d.status)}</div><div class="summary-line"><span>Saldo sudah dikreditkan</span><b>${d.saldoCredited?'Ya':'Tidak'}</b></div><p class="muted" style="font-size:12px">${esc(d.catatan||'Tidak ada catatan.')}</p><h4 style="font-size:12px;margin:15px 0 5px">Lampiran Setoran</h4>${attachmentMarkup(d)}<div class="modal-actions"><button class="btn primary" onclick="closeModal()">Tutup</button></div>`)}
// Persist data changes and keep UI derived from the same state.
render();
refreshAdminWhatsApp();
</script>
</body>
</html>
